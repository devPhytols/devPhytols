name: Generate Arcade Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Bomberman contribution graph
        run: |
          mkdir -p dist
          npm install pacman-contribution-graph
          cat > generate.mjs << 'EOF'
          import { ArcadeRenderer } from 'pacman-contribution-graph';
          import { writeFileSync } from 'fs';

          const token = process.env.GITHUB_TOKEN;

          function generate(game, theme, filename) {
            return new Promise((resolve, reject) => {
              const renderer = new ArcadeRenderer({
                game,
                username: 'devPhytols',
                platform: 'github',
                gameTheme: theme,
                githubSettings: {
                  accessToken: token,
                },
                svgCallback: (svg) => {
                  writeFileSync('dist/' + filename, svg);
                  console.log('Generated: ' + filename);
                  resolve();
                },
                gameOverCallback: resolve,
              });
              renderer.start();
            });
          }

          await generate('bomberman', 'github-dark', 'bomberman-dark.svg');
          await generate('bomberman', 'github', 'bomberman.svg');
          await generate('pacman', 'github-dark', 'pacman-dark.svg');
          await generate('pacman', 'github', 'pacman.svg');
          EOF
          node generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



