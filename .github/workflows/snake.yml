name: Generate Arcade Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Bomberman contribution graph
        run: |
          npm install -g pacman-contribution-graph
          mkdir -p dist
          node -e "
          const { ArcadeRenderer } = require('pacman-contribution-graph');
          const fs = require('fs');

          function generate(game, theme, filename) {
            return new Promise((resolve) => {
              const renderer = new ArcadeRenderer({
                game,
                username: 'devPhytols',
                platform: 'github',
                gameTheme: theme,
                svgCallback: (svg) => {
                  fs.writeFileSync('dist/' + filename, svg);
                  resolve();
                },
                gameOverCallback: resolve,
              });
              renderer.start();
            });
          }

          (async () => {
            await generate('bomberman', 'github-dark', 'bomberman-dark.svg');
            await generate('bomberman', 'github', 'bomberman.svg');
            await generate('pacman', 'github-dark', 'pacman-dark.svg');
            await generate('pacman', 'github', 'pacman.svg');
          })();
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



